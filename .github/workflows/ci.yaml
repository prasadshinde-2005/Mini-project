name: CI Pipeline
 
on: push
 
jobs:
  project-testing:
    runs-on: ubuntu-latest
 
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run DVC pipeline
        run: |
          dvc repro
 
      - name: Run model loading test
        run: |
          python -m unittest tests/test_model.py
      
      - name: promot model to production 
        if: success()
        run: python scripts/promot_model.py

      - name: run flask app tests
        if: success()
        run: python -m unittest tests/test_flask.py 
 
      # login to dockerhub 
      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME }}
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN }}
     

      # build the docker image 
      - name:
        if: success()
        run: |
          docker build -t ${{secrets.DOCKER_HUB_USERNAME }}/emotion2:latest .

       # push into docker hub 
      - name:  
        if: success()
        run: |
          docker push  ${{secrets.DOCKER_HUB_USERNAME }}/emotion2:latest



  