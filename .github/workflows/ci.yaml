name: CI-Pipeline 

on: push 

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:

      - name: code checkout
        uses: actions/checkout@v4 

      - name: setup python  
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies 
        run: |
          pip install -r requirements.txt

      - name: run DVC pipeline  
        env:
          DAGSHUB_USER_TOKEN: ${{secrets.DAGSHUB_TOKEN}}
        run: |
          dvc repro


